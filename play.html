<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101a16;
  color:#eee;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}

h1{color:#d8b66a;font-size:25px}
.subtitle{color:#aaa;margin-bottom:20px}

.panel{
  max-width:520px;
  margin:auto;
  background:#1c2a23;
  padding:18px;
  border-radius:14px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  margin:12px 0;
}

select,button{
  padding:11px;
  border:0;
  border-radius:7px;
  font-size:14px;
}

select{background:#eee;color:#222}
button{background:#c6a45d;color:#172019;font-weight:bold}
button:active{opacity:.7}

#board{
  width:min(calc(90vw - 40px),420px);
  aspect-ratio:1/1;
  margin:30px auto 36px;
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:repeat(8,minmax(0,1fr));
  border:5px solid #eee3ca;
  position:relative;
  container-type:inline-size;
}

.square{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
}

.piece-svg{
  display:block;
  width:100%;
  height:100%;
  position:relative;
  z-index:1;
  overflow:visible;
  --fill:#fff9ed;
  --detail:#101010;
  --shine:#fff;
}

.piece-svg.black{
  --fill:#151515;
  --detail:#fff9ed;
  --shine:#777;
}

.piece-svg.white{
  --fill:#fff9ed;
  --detail:#101010;
  --shine:#fff;
}

.coord{
  position:absolute;
  display:block;
  font-family:Arial,sans-serif;
  font-size:10px;
  font-weight:600;
  line-height:1;
  color:#eee3ca;
  pointer-events:none;
  z-index:5;
}

.coord.rank{
  left:-15px;
  top:50%;
  transform:translateY(-50%);
  width:10px;
  text-align:center;
}

.coord.file{
  left:50%;
  bottom:-17px;
  transform:translateX(-50%);
}

.light{background:#eee3ca;color:#222}
.dark{background:#72916f;color:#222}
.selected{background:#e5cf58!important}

.target:after{
  content:"";
  position:absolute;
  width:23%;
  height:23%;
  border-radius:50%;
  background:#253c2c88;
}

#status{
  color:#e4c77e;
  min-height:24px;
  font-weight:bold;
}

#history{
  background:#111b16;
  padding:12px;
  border-radius:8px;
  text-align:left;
  min-height:45px;
  max-height:150px;
  overflow:auto;
  line-height:1.7;
}

.small{
  font-size:12px;
  color:#aaa;
  margin-top:15px;
}
</style>
</head>

<body>

<h1>BLACKMAR-DIMAR</h1>
<div class="subtitle">Chess Club · Play against the computer</div>

<div class="panel">

  <div class="controls">
    <select id="level">
      <option value="1">Начинающий</option>
      <option value="4">Лёгкий</option>
      <option value="8" selected>Средний</option>
      <option value="12">Сильный</option>
      <option value="15">Эксперт</option>
    </select>

    <select id="side">
      <option value="w">Играть белыми</option>
      <option value="b">Играть чёрными</option>
    </select>
  </div>

  <div id="status">Подготовка партии</div>
  <div id="board"></div>

  <div class="controls">
    <button onclick="newGame()">Новая партия</button>
    <button onclick="undoMove()">Отменить ход</button>
    <button onclick="flipBoard()">Перевернуть доску</button>
  </div>

  <h3>История ходов</h3>
  <div id="history">Партия ещё не началась</div>

  <div class="small">
    Компьютер использует шахматный движок Stockfish Online.
  </div>

</div>

<script>

const game = new Chess();

const board = document.getElementById("board");
const statusBox = document.getElementById("status");
const historyBox = document.getElementById("history");

const SVG_NS = "http://www.w3.org/2000/svg";

let selected = null;
let flipped = false;
let thinking = false;


function createPieceElement(piece){

  const svg = document.createElementNS(SVG_NS,"svg");

  svg.setAttribute("viewBox","0 0 100 100");

  svg.setAttribute(
    "class",
    "piece-svg "+(piece.color==="w"?"white":"black")
  );

  svg.setAttribute("role","img");

  const use = document.createElementNS(SVG_NS,"use");

  use.setAttribute("href","#piece-"+piece.type);

  svg.appendChild(use);

  return svg;
}


function render(){

  board.innerHTML="";

  const files = flipped ? "hgfedcba" : "abcdefgh";
  const ranks = flipped ? "12345678" : "87654321";

  for(let r of ranks){

    for(let f of files){

      const square = f+r;
      const piece = game.get(square);

      const el = document.createElement("div");

      const dark = (files.indexOf(f)+Number(r))%2===0;

      el.className="square "+(dark?"dark":"light");

      el.dataset.square=square;

      if(piece){
        el.appendChild(createPieceElement(piece));
      }

      if(f===files[0]){

        const label=document.createElement("span");

        label.className="coord rank";
        label.textContent=r;

        el.appendChild(label);
      }

      if(r===ranks[ranks.length-1]){

        const label=document.createElement("span");

        label.className="coord file";
        label.textContent=f;

        el.appendChild(label);
      }

      if(selected===square){
        el.classList.add("selected");
      }

      if(selected && game.moves({square:selected,verbose:true}).some(m=>m.to===square)){
        el.classList.add("target");
      }

      el.onclick=()=>clickSquare(square);

      board.appendChild(el);
    }
  }

  updateStatus();
  updateHistory();
}


function clickSquare(square){

  if(thinking || game.game_over()) return;

  const human=document.getElementById("side").value;

  if(game.turn()!==human) return;

  const piece=game.get(square);

  if(!selected){

    if(piece && piece.color===human){
      selected=square;
      render();
    }

    return;
  }

  if(piece && piece.color===human){

    selected=square;
    render();

    return;
  }

  const move=game.move({
    from:selected,
    to:square,
    promotion:"q"
  });

  selected=null;

  if(move){

    render();

    if(!game.game_over()){
      computerMove();
    }

  }else{

    render();
  }
}


function updateStatus(){

  if(game.in_checkmate()){
    statusBox.textContent="Мат! Партия окончена.";
  }

  else if(game.in_draw()){
    statusBox.textContent="Ничья. Партия окончена.";
  }

  else if(game.in_check()){
    statusBox.textContent="Шах!";
  }

  else{
    statusBox.textContent=
      game.turn()==="w"?"Ход белых":"Ход чёрных";
  }
}


function updateHistory(){

  const moves=game.history();

  if(!moves.length){

    historyBox.textContent="Партия ещё не началась";

    return;
  }

  let out="";

  for(let i=0;i<moves.length;i+=2){

    out+=(Math.floor(i/2)+1)+". "+
      moves[i]+" "+
      (moves[i+1]||"")+"<br>";
  }

  historyBox.innerHTML=out;

  historyBox.scrollTop=historyBox.scrollHeight;
}


async function computerMove(){

  if(game.game_over()) return;

  thinking=true;

  statusBox.textContent="Компьютер думает…";

  try{

    const depth=document.getElementById("level").value;

    const fen=encodeURIComponent(game.fen());

    const url=
      "https://stockfish.online/api/s/v2.php?fen="+
      fen+"&depth="+depth;

    const response=await fetch(url);

    const data=await response.json();

    if(!data.success || !data.bestmove){
      throw new Error("Engine unavailable");
    }

    const match=data.bestmove.match(
      /[a-h][1-8][a-h][1-8][qrbn]?/
    );

    if(!match){
      throw new Error("Invalid move");
    }

    const uci=match[0];

    const move=game.move({
      from:uci.slice(0,2),
      to:uci.slice(2,4),
      promotion:uci[4]||"q"
    });

    if(!move){
      throw new Error("Illegal move");
    }

  }

  catch(error){

    const moves=game.moves();

    if(moves.length){

      const fallback=
        moves[Math.floor(Math.random()*moves.length)];

      game.move(fallback);

    }else{

      statusBox.textContent=
        "Не удалось получить ответ компьютера";
    }
  }

  thinking=false;

  render();
}


function newGame(){

  game.reset();

  selected=null;
  thinking=false;

  const side=document.getElementById("side").value;

  render();

  if(side==="b"){
    computerMove();
  }
}


function undoMove(){

  if(thinking) return;

  game.undo();

  if(
    game.history().length &&
    game.turn()!==document.getElementById("side").value
  ){
    game.undo();
  }

  selected=null;

  render();
}


function flipBoard(){

  flipped=!flipped;

  render();
}


document
  .getElementById("side")
  .addEventListener("change",newGame);

render();

</script>
