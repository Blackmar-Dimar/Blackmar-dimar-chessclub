<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackmar-Dimar Chess Club — Play</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101a16;color:#eee;font-family:Arial,sans-serif;text-align:center;padding:20px}
h1{color:#d8b66a;font-size:25px}
.subtitle{color:#aaa;margin-bottom:20px}
.panel{max-width:520px;margin:auto;background:#1c2a23;padding:18px;border-radius:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
select,button{padding:11px;border:0;border-radius:7px;font-size:14px}
select{background:#eee;color:#222}
button{background:#c6a45d;color:#172019;font-weight:bold}
button:active{opacity:.7}
#board{
  width:min(calc(90vw - 40px),420px);
  aspect-ratio:1 / 1;
  margin:30px auto 36px;
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:repeat(8,minmax(0,1fr));
  border:5px solid #eee3ca;
  position:relative;
  container-type:inline-size;
}
.square{aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.piece-svg{display:block;width:88%;height:92%;position:relative;z-index:1;overflow:visible;--piece-fill:#fff;--piece-outline:#171717;--piece-accent:#171717;--piece-cross-outline:#eee3ca}
.piece-svg.black{--piece-fill:#171717;--piece-outline:#eee3ca;--piece-accent:#eee3ca;--piece-cross-outline:#171717}
.piece-svg.white{--piece-fill:#fff;--piece-outline:#171717;--piece-accent:#171717;--piece-cross-outline:#eee3ca}
.coord{position:absolute;display:block;font-family:Arial,sans-serif;font-size:10px;font-weight:600;line-height:1;color:#eee3ca;pointer-events:none;z-index:5}
.coord.rank{left:-15px;top:50%;transform:translateY(-50%);width:10px;text-align:center}
.coord.file{left:50%;bottom:-17px;transform:translateX(-50%)}
.light{background:#eee3ca;color:#222}
.dark{background:#72916f;color:#222}
.selected{background:#e5cf58!important}
.target:after{content:"";position:absolute;width:23%;height:23%;border-radius:50%;background:#253c2c88}
#status{color:#e4c77e;min-height:24px;font-weight:bold}
#history{background:#111b16;padding:12px;border-radius:8px;text-align:left;min-height:45px;max-height:150px;overflow:auto;line-height:1.7}
.small{font-size:12px;color:#aaa;margin-top:15px}
</style>
</head>
<body>
<h1>BLACKMAR-DIMAR</h1>
<div class="subtitle">Chess Club · Play against the computer</div>

<div class="panel">
  <div class="controls">
    <select id="level">
      <option value="1">Начинающий</option>
      <option value="4">Лёгкий</option>
      <option value="8" selected>Средний</option>
      <option value="12">Сильный</option>
      <option value="15">Эксперт</option>
    </select>
    <select id="side">
      <option value="w">Играть белыми</option>
      <option value="b">Играть чёрными</option>
    </select>
  </div>

  <div id="status">Подготовка партии</div>
  <div id="board"></div>

  <div class="controls">
    <button onclick="newGame()">Новая партия</button>
    <button onclick="undoMove()">Отменить ход</button>
    <button onclick="flipBoard()">Перевернуть доску</button>
  </div>

  <h3>История ходов</h3>
  <div id="history">Партия ещё не началась</div>
  <div class="small">Компьютер использует шахматный движок Stockfish Online.</div>
</div>

<!-- Векторные фигуры: один и тот же силуэт для обеих сторон, контрастные детали меняют цвет автоматически. -->
<svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
<defs>

    <circle cx="50" cy="18" r="12.5" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.2"/>

    <path d="M37 34 Q50 37 63 34 M35 40 Q50 43 65 40" fill="none" stroke="var(--piece-accent)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M24 77 Q50 74 76 77 L78 84 Q78 88 73 88 H27 Q22 88 22 84 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M25 79 Q50 77 75 79 M25 84 Q50 82 75 84" fill="none" stroke="var(--piece-accent)" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

  <symbol id="piece-r" viewBox="0 0 100 100">
    <path d="M22 12 H34 V22 H43 V12 H57 V22 H66 V12 H78 V32 Q78 38 72 40 L69 73 H31 L28 40 Q22 38 22 32 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M31 43 H69 M30 53 H70 M31 63 H69" fill="none" stroke="var(--piece-accent)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M31 43 V53 M48 43 V53 M65 43 V53 M40 53 V63 M58 53 V63" fill="none" stroke="var(--piece-accent)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M27 73 Q50 69 73 73 L78 81 Q80 86 73 87 H27 Q20 86 22 81 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.4"/>
    <path d="M25 79 Q50 76 75 79" fill="none" stroke="var(--piece-accent)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M21 89 H79 L82 94 H18 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3" stroke-linejoin="round"/>
  </symbol>

  <symbol id="piece-n" viewBox="0 0 100 100">
    <path d="M22 84 Q25 73 31 64 Q35 57 33 49 Q30 39 37 29 Q42 22 49 15 L55 29 Q64 27 71 36 Q82 49 77 66 L75 82 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M36 32 Q43 36 49 37 M37 43 Q44 46 51 44 M43 53 Q52 57 60 54 M50 63 Q60 66 72 61" fill="none" stroke="var(--piece-accent)" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M49 15 Q55 8 60 17 L57 31" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="43" cy="39" r="2.3" fill="var(--piece-accent)"/>
    <path d="M22 83 Q50 79 78 83 L81 90 Q81 94 75 94 H25 Q19 94 19 90 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.4"/>
    <path d="M23 87 Q50 84 77 87" fill="none" stroke="var(--piece-accent)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Контрастная грива вдоль затылка -->
    <path d="M59 27 Q69 31 75 41 M62 38 L78 48 M65 50 L78 58 M66 62 L76 68" fill="none" stroke="var(--piece-accent)" stroke-width="3.1" stroke-linecap="round"/>
  </symbol>

  <symbol id="piece-b" viewBox="0 0 100 100">
    <circle cx="50" cy="14" r="7" fill="var(--piece-accent)" stroke="var(--piece-outline)" stroke-width="2.4"/>
    <path d="M50 22 C34 33 29 48 34 62 Q38 72 50 74 Q62 72 66 62 C71 48 66 33 50 22 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.4"/>
    <path d="M56 31 L44 49 H54 L45 65 L62 45 H52 Z" fill="var(--piece-accent)" stroke="var(--piece-outline)" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M35 73 Q50 70 65 73 L70 79 Q71 84 65 85 H35 Q29 84 30 79 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.2"/>
    <path d="M24 88 Q35 83 42 86 Q50 89 58 86 Q67 83 76 88 L83 92 Q85 96 77 97 H23 Q15 96 17 92 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.2"/>
    <path d="M27 89 Q50 86 73 89" fill="none" stroke="var(--piece-accent)" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

  <symbol id="piece-q" viewBox="0 0 100 100">
    <path d="M25 31 L34 61 Q50 67 66 61 L75 31 L64 52 L58 24 L50 50 L42 24 L36 52 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.3" stroke-linejoin="round"/>
    <path d="M31 65 Q50 69 69 65 L72 74 Q50 80 28 74 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.2"/>
    <path d="M28 80 Q50 76 72 80 L75 88 Q50 94 25 88 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.2"/>
    <path d="M31 83 Q50 80 69 83" fill="none" stroke="var(--piece-accent)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="25" cy="27" r="6.5" fill="var(--piece-accent)" stroke="var(--piece-outline)" stroke-width="2"/>
    <circle cx="42" cy="19" r="6.5" fill="var(--piece-accent)" stroke="var(--piece-outline)" stroke-width="2"/>
    <circle cx="50" cy="13" r="6.5" fill="var(--piece-accent)" stroke="var(--piece-outline)" stroke-width="2"/>
    <circle cx="58" cy="19" r="6.5" fill="var(--piece-accent)" stroke="var(--piece-outline)" stroke-width="2"/>
    <circle cx="75" cy="27" r="6.5" fill="var(--piece-accent)" stroke="var(--piece-outline)" stroke-width="2"/>
  </symbol>

  <symbol id="piece-k" viewBox="0 0 100 100">
    <path d="M50 7 V32 M39 18 H61" fill="none" stroke="var(--piece-accent)" stroke-width="7" stroke-linecap="square"/>
    <path d="M50 7 V32 M39 18 H61" fill="none" stroke="var(--piece-cross-outline)" stroke-width="1.2" stroke-linecap="square"/>
    <path d="M50 34 C39 28 25 33 23 48 Q22 62 36 69 Q43 73 50 67 Q57 73 64 69 Q78 62 77 48 C75 33 61 28 50 34 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.4"/>
    <path d="M31 72 Q50 77 69 72 L73 80 Q50 87 27 80 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.2"/>
    <path d="M27 85 Q50 81 73 85 L77 92 Q50 98 23 92 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.2"/>
    <path d="M30 87 Q50 84 70 87" fill="none" stroke="var(--piece-accent)" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>
</defs>
</svg>

<script>
const game = new Chess();
const board = document.getElementById("board");
const statusBox = document.getElementById("status");
const historyBox = document.getElementById("history");
const SVG_NS = "http://www.w3.org/2000/svg";

let selected = null;
let flipped = false;
let thinking = false;

function createPieceElement(piece){
  const svg = document.createElementNS(SVG_NS,"svg");
  svg.setAttribute("viewBox","0 0 100 100");
  svg.setAttribute("class","piece-svg "+(piece.color==="w"?"white":"black"));
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label",piece.color==="w"?"Белая фигура":"Чёрная фигура");
  const use = document.createElementNS(SVG_NS,"use");
  use.setAttribute("href","#piece-"+piece.type);
  svg.appendChild(use);
  return svg;
}

function render(){
  board.innerHTML="";
  const files = flipped ? "hgfedcba" : "abcdefgh";
  const ranks = flipped ? "12345678" : "87654321";

  for(let r of ranks){
    for(let f of files){
      const square = f+r;
      const piece = game.get(square);
      const el = document.createElement("div");
      const dark = (files.indexOf(f)+Number(r))%2===0;
      el.className="square "+(dark?"dark":"light");
      el.dataset.square=square;
      if(piece) el.appendChild(createPieceElement(piece));

      if(f===files[0]){
        const label=document.createElement("span");
        label.className="coord rank";
        label.textContent=r;
        el.appendChild(label);
      }
      if(r===ranks[ranks.length-1]){
        const label=document.createElement("span");
        label.className="coord file";
        label.textContent=f;
        el.appendChild(label);
      }
      if(selected===square) el.classList.add("selected");
      if(selected && game.moves({square:selected,verbose:true}).some(m=>m.to===square))
        el.classList.add("target");
      el.onclick=()=>clickSquare(square);
      board.appendChild(el);
    }
  }
  updateStatus();
  updateHistory();
}

function clickSquare(square){
  if(thinking || game.game_over()) return;
  const human=document.getElementById("side").value;
  if(game.turn()!==human) return;

  const piece=game.get(square);
  if(!selected){
    if(piece && piece.color===human){
      selected=square;
      render();
    }
    return;
  }

  if(piece && piece.color===human){
    selected=square;
    render();
    return;
  }

  let move=game.move({from:selected,to:square,promotion:"q"});
  selected=null;
  if(move){
    render();
    if(!game.game_over()) computerMove();
  }else render();
}

function updateStatus(){
  if(game.in_checkmate()) statusBox.textContent="Мат! Партия окончена.";
  else if(game.in_draw()) statusBox.textContent="Ничья. Партия окончена.";
  else if(game.in_check()) statusBox.textContent="Шах!";
  else statusBox.textContent=game.turn()==="w"?"Ход белых":"Ход чёрных";
}

function updateHistory(){
  const moves=game.history();
  if(!moves.length){historyBox.textContent="Партия ещё не началась";return;}
  let out="";
  for(let i=0;i<moves.length;i+=2){
    out+=(Math.floor(i/2)+1)+". "+moves[i]+" "+(moves[i+1]||"")+"<br>";
  }
  historyBox.innerHTML=out;
  historyBox.scrollTop=historyBox.scrollHeight;
}

async function computerMove(){
  if(game.game_over()) return;
  thinking=true;
  statusBox.textContent="Компьютер думает…";

  try{
    const depth=document.getElementById("level").value;
    const fen=encodeURIComponent(game.fen());
    const url="https://stockfish.online/api/s/v2.php?fen="+fen+"&depth="+depth;
    const response=await fetch(url);
    const data=await response.json();

    if(!data.success || !data.bestmove) throw new Error("Engine unavailable");

    const match=data.bestmove.match(/[a-h][1-8][a-h][1-8][qrbn]?/);
    if(!match) throw new Error("Invalid move");

    const uci=match[0];
    const move=game.move({
      from:uci.slice(0,2),
      to:uci.slice(2,4),
      promotion:uci[4]||"q"
    });
    if(!move) throw new Error("Illegal move");

  }catch(error){
    const moves=game.moves();
    if(moves.length){
      const fallback=moves[Math.floor(Math.random()*moves.length)];
      game.move(fallback);
    }else{
      statusBox.textContent="Не удалось получить ответ компьютера";
    }
  }

  thinking=false;
  render();
}

function newGame(){
  game.reset();
  selected=null;
  thinking=false;
  const side=document.getElementById("side").value;
  render();
  if(side==="b") computerMove();
}

function undoMove(){
  if(thinking) return;
  game.undo();
  if(game.history().length && game.turn()!==document.getElementById("side").value)
    game.undo();
  selected=null;
  render();
}

function flipBoard(){
  flipped=!flipped;
  render();
}

document.getElementById("side").addEventListener("change",newGame);
render();
</script>
</body>
</html>
