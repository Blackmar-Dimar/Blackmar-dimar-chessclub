<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackmar-Dimar Chess Club — Play</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101a16;color:#eee;font-family:Arial,sans-serif;text-align:center;padding:20px}
h1{color:#d8b66a;font-size:25px}
.subtitle{color:#aaa;margin-bottom:20px}
.panel{max-width:520px;margin:auto;background:#1c2a23;padding:18px;border-radius:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
select,button{padding:11px;border:0;border-radius:7px;font-size:14px}
select{background:#eee;color:#222}
button{background:#c6a45d;color:#172019;font-weight:bold}
button:active{opacity:.7}
#board{
  width:min(calc(90vw - 40px),420px);
  aspect-ratio:1 / 1;
  margin:30px auto 36px;
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:repeat(8,minmax(0,1fr));
  border:5px solid #eee3ca;
  position:relative;
  container-type:inline-size;
}
.square{aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.piece-svg{
  display:block;
  width:100%;
  height:100%;
  position:relative;
  z-index:1;
  overflow:visible;
  --piece-fill:#fff;
  --piece-outline:#171717;
  --piece-accent:#171717;
  --piece-cross-outline:#eee3ca;
  --piece-highlight:#777;
}
.piece-svg.black{
  --piece-fill:#171717;
  --piece-outline:#eee3ca;
  --piece-accent:#eee3ca;
  --piece-cross-outline:#171717;
}
.piece-svg.white{
  --piece-fill:#fff;
  --piece-outline:#171717;
  --piece-accent:#171717;
  --piece-cross-outline:#eee3ca;
}
.coord{position:absolute;display:block;font-family:Arial,sans-serif;font-size:10px;font-weight:600;line-height:1;color:#eee3ca;pointer-events:none;z-index:5}
.coord.rank{left:-15px;top:50%;transform:translateY(-50%);width:10px;text-align:center}
.coord.file{left:50%;bottom:-17px;transform:translateX(-50%)}
.light{background:#eee3ca;color:#222}
.dark{background:#72916f;color:#222}
.selected{background:#e5cf58!important}
.target:after{content:"";position:absolute;width:23%;height:23%;border-radius:50%;background:#253c2c88}
#status{color:#e4c77e;min-height:24px;font-weight:bold}
#history{background:#111b16;padding:12px;border-radius:8px;text-align:left;min-height:45px;max-height:150px;overflow:auto;line-height:1.7}
.small{font-size:12px;color:#aaa;margin-top:15px}
</style>
</head>
<body>
<h1>BLACKMAR-DIMAR</h1>
<div class="subtitle">Chess Club · Play against the computer</div>

<div class="panel">
  <div class="controls">
    <select id="level">
      <option value="1">Начинающий</option>
      <option value="4">Лёгкий</option>
      <option value="8" selected>Средний</option>
      <option value="12">Сильный</option>
      <option value="15">Эксперт</option>
    </select>
    <select id="side">
      <option value="w">Играть белыми</option>
      <option value="b">Играть чёрными</option>
    </select>
  </div>

  <div id="status">Подготовка партии</div>
  <div id="board"></div>

  <div class="controls">
    <button onclick="newGame()">Новая партия</button>
    <button onclick="undoMove()">Отменить ход</button>
    <button onclick="flipBoard()">Перевернуть доску</button>
  </div>

  <h3>История ходов</h3>
  <div id="history">Партия ещё не началась</div>
  <div class="small">Компьютер использует шахматный движок Stockfish Online.</div>
</div>

<!-- SVG-комплект шахматных фигур -->

    <path d="M20 86 Q50 83 80 86 L82 92 Q82 96 76 96 H24 Q18 96 18 92 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.2"/>
    <path d="M23 90 Q50 88 77 90" fill="none" stroke="var(--piece-accent)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M43 8 Q50 4 57 9" fill="none" stroke="var(--piece-highlight)" stroke-width="1.7" stroke-linecap="round" opacity=".55"/>

  <!-- Ладья -->

    <path d="M15 9 H31 V21 H40 V9 H60 V21 H69 V9 H85 V30 Q85 36 79 39 L74 75 H26 L21 39 Q15 36 15 30 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.5" stroke-linejoin="round"/>

    <path d="M29 43 H71 M27 54 H73 M26 65 H74" fill="none" stroke="var(--piece-accent)" stroke-width="2.1" stroke-linecap="round"/>

  <!-- Конь -->
  <symbol id="piece-n" viewBox="0 0 100 100">

    <path d="M23 81 Q50 77 77 81 L81 88 Q82 93 75 94 H25 Q18 93 19 88 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.4"/>
    <path d="M22 86 Q50 82 78 86" fill="none" stroke="var(--piece-accent)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 93 H82 L84 97 H16 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="2.6"/>
  </symbol>

  <!-- Слон -->
  <symbol id="piece-b" viewBox="0 0 100 100">

    <path d="M34 74 Q50 70 66 74 L72 81 Q73 86 66 87 H34 Q27 86 28 81 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.3"/>

  <!-- Ферзь -->
  <symbol id="piece-q" viewBox="0 0 100 100">
    <path d="M19 29 L30 61 Q50 69 70 61 L81 29 L66 48 L59 23 L50 49 L41 23 L34 48 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.4" stroke-linejoin="round"/>

    <path d="M25 78 Q50 73 75 78 L79 87 Q50 95 21 87 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.3"/>
    <path d="M27 81 Q50 77 73 81" fill="none" stroke="var(--piece-accent)" stroke-width="2.5" stroke-linecap="round"/>

  </symbol>

  <!-- Король -->
  <symbol id="piece-k" viewBox="0 0 100 100">
    <path d="M50 5 V31 M38 17 H62" fill="none" stroke="var(--piece-accent)" stroke-width="7.5" stroke-linecap="square"/>
    <path d="M50 5 V31 M38 17 H62" fill="none" stroke="var(--piece-cross-outline)" stroke-width="1.25" stroke-linecap="square"/>
    <path d="M50 32 C43 27 33 27 27 34 Q18 44 24 57 Q29 69 43 72 Q50 74 50 67 Q50 74 57 72 Q71 69 76 57 Q82 44 73 34 C67 27 57 27 50 32 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.5"/>
    <path d="M29 73 Q50 78 71 73 L76 81 Q50 89 24 81 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.3"/>
    <path d="M23 87 Q50 82 77 87 L81 94 Q50 99 19 94 Z" fill="var(--piece-fill)" stroke="var(--piece-outline)" stroke-width="3.3"/>
    <path d="M27 89 Q50 85 73 89" fill="none" stroke="var(--piece-accent)" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>
</defs>
</svg>

<script>
const game = new Chess();
const board = document.getElementById("board");
const statusBox = document.getElementById("status");
const historyBox = document.getElementById("history");
const SVG_NS = "http://www.w3.org/2000/svg";

let selected = null;
let flipped = false;
let thinking = false;

function createPieceElement(piece){
  const svg = document.createElementNS(SVG_NS,"svg");
  svg.setAttribute("viewBox","0 0 100 100");
  svg.setAttribute("class","piece-svg "+(piece.color==="w"?"white":"black"));
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label",piece.color==="w"?"Белая фигура":"Чёрная фигура");
  const use = document.createElementNS(SVG_NS,"use");
  use.setAttribute("href","#piece-"+piece.type);
  svg.appendChild(use);
  return svg;
}

function render(){
  board.innerHTML="";
  const files = flipped ? "hgfedcba" : "abcdefgh";
  const ranks = flipped ? "12345678" : "87654321";

  for(let r of ranks){
    for(let f of files){
      const square = f+r;
      const piece = game.get(square);
      const el = document.createElement("div");
      const dark = (files.indexOf(f)+Number(r))%2===0;
      el.className="square "+(dark?"dark":"light");
      el.dataset.square=square;
      if(piece) el.appendChild(createPieceElement(piece));

      if(f===files[0]){
        const label=document.createElement("span");
        label.className="coord rank";
        label.textContent=r;
        el.appendChild(label);
      }
      if(r===ranks[ranks.length-1]){
        const label=document.createElement("span");
        label.className="coord file";
        label.textContent=f;
        el.appendChild(label);
      }
      if(selected===square) el.classList.add("selected");
      if(selected && game.moves({square:selected,verbose:true}).some(m=>m.to===square))
        el.classList.add("target");
      el.onclick=()=>clickSquare(square);
      board.appendChild(el);
    }
  }
  updateStatus();
  updateHistory();
}

function clickSquare(square){
  if(thinking || game.game_over()) return;
  const human=document.getElementById("side").value;
  if(game.turn()!==human) return;

  const piece=game.get(square);
  if(!selected){
    if(piece && piece.color===human){
      selected=square;
      render();
    }
    return;
  }

  if(piece && piece.color===human){
    selected=square;
    render();
    return;
  }

  let move=game.move({from:selected,to:square,promotion:"q"});
  selected=null;
  if(move){
    render();
    if(!game.game_over()) computerMove();
  }else render();
}

function updateStatus(){
  if(game.in_checkmate()) statusBox.textContent="Мат! Партия окончена.";
  else if(game.in_draw()) statusBox.textContent="Ничья. Партия окончена.";
  else if(game.in_check()) statusBox.textContent="Шах!";
  else statusBox.textContent=game.turn()==="w"?"Ход белых":"Ход чёрных";
}

function updateHistory(){
  const moves=game.history();
  if(!moves.length){historyBox.textContent="Партия ещё не началась";return;}
  let out="";
  for(let i=0;i<moves.length;i+=2){
    out+=(Math.floor(i/2)+1)+". "+moves[i]+" "+(moves[i+1]||"")+"<br>";
  }
  historyBox.innerHTML=out;
  historyBox.scrollTop=historyBox.scrollHeight;
}

async function computerMove(){
  if(game.game_over()) return;
  thinking=true;
  statusBox.textContent="Компьютер думает…";

  try{
    const depth=document.getElementById("level").value;
    const fen=encodeURIComponent(game.fen());
    const url="https://stockfish.online/api/s/v2.php?fen="+fen+"&depth="+depth;
    const response=await fetch(url);
    const data=await response.json();

    if(!data.success || !data.bestmove) throw new Error("Engine unavailable");

    const match=data.bestmove.match(/[a-h][1-8][a-h][1-8][qrbn]?/);
    if(!match) throw new Error("Invalid move");

    const uci=match[0];
    const move=game.move({
      from:uci.slice(0,2),
      to:uci.slice(2,4),
      promotion:uci[4]||"q"
    });
    if(!move) throw new Error("Illegal move");

  }catch(error){
    const moves=game.moves();
    if(moves.length){
      const fallback=moves[Math.floor(Math.random()*moves.length)];
      game.move(fallback);
    }else{
      statusBox.textContent="Не удалось получить ответ компьютера";
    }
  }

  thinking=false;
  render();
}

function newGame(){
  game.reset();
  selected=null;
  thinking=false;
  const side=document.getElementById("side").value;
  render();
  if(side==="b") computerMove();
}

function undoMove(){
  if(thinking) return;
  game.undo();
  if(game.history().length && game.turn()!==document.getElementById("side").value)
    game.undo();
  selected=null;
  render();
}

function flipBoard(){
  flipped=!flipped;
  render();
}

document.getElementById("side").addEventListener("change",newGame);
render();
</script>
</body>
</html>
